<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HR AUTOMATE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#0056b3;
    color:white;
    padding:40px;
    text-align:center;
}

header h1{
    font-size:50px;
}

header p{
    margin-top:10px;
    font-size:18px;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:40px 0;
}

.titulo{
    text-align:center;
    margin-bottom:40px;
}

.empresas{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card-content h3{
    color:#0056b3;
    margin-bottom:10px;
}

.card-content p{
    margin-bottom:15px;
}

.botao{
    display:inline-block;
    background:#0056b3;
    color:white;
    padding:10px 20px;
    text-decoration:none;
    border-radius:5px;
}

.botao:hover{
    background:#003f85;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}

</style>

</head>

HTML
1
<body>

<h1>Teste</h1>

./eaton.jpg

</body>
</html>
